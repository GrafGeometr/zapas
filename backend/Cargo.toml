[package]
name = "zapas"
version = "0.0.1"
edition = "2024"

[dependencies]
# Асинхронность, tcp/ip, http.
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9" }

# Документация API.
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Сериализация.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }

# Валидация данных.
validator = { version = "0.20.0", features = ["derive"] }

# Базы данных.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono"] }

# Полезные структуры.
uuid = { version = "1.23.4", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Пароли, секреты, генерация случайных чисел.
argon2 = { version = "0.5.3" }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand = { version = "0.10.2" }

# Логирование.
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

# Кастомные ошибки.
thiserror = { version = "2.0.18" }

# Переменные окружения.
dotenvy = "0.15.7"
